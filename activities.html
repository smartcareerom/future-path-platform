<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الفعاليات والبرامج</title>

<style>

body{
    font-family: Arial, sans-serif;
    direction: rtl;
    background:#f4f8fb;
    margin:0;
    padding:20px;
}

h1{
    text-align:center;
    color:#0b5ed7;
}

.intro{
    text-align:center;
    margin-bottom:30px;
}

.gallery{
    display:flex;
    justify-content:center;
    gap:25px;
    flex-wrap:wrap;
}

.card{
    background:white;
    width:350px;
    border-radius:15px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
    overflow:hidden;
    text-align:center;
}

.card img{
    width:100%;
    height:250px;
    object-fit:cover;
}

.card p{
    padding:15px;
    line-height:1.8;
}

.back{
    text-align:center;
    margin-top:40px;
}

</style>

</head>

<body>

<h1>🖼️ الفعاليات والبرامج</h1>

<p class="intro">
توثق هذه الصفحة أبرز الفعاليات والبرامج المهنية المنفذة بالمدرسة.
</p>
<div class="gallery">

    <div class="card">
    activities/activity1.jpg
    
    <p>
    فعالية مهنية لتنمية الوعي المهني لدى الطالبات.
    </p>
    </div>
    
    <div class="card">
    <img src="activities/activity2.jpg" alt="فعالية 2">
    
    ف على التخصصات الجامعية.
    </p>
    </div>
    
    <div class="card">
    activities/activity3.jpg
    
    <p>

    </div>

<div class="back">

</html>
