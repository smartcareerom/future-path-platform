<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الاستشارات المهنية</title>

<style>

body{
    font-family: Arial, sans-serif;
    direction: rtl;
    background:#f4f8fb;
    margin:0;
    padding:20px;
}

h1{
    text-align:center;
    color:#0b5ed7;
}

.card{
    background:white;
    max-width:900px;
    margin:20px auto;
    padding:25px;
    border-radius:15px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

details{
    background:#ffffff;
    margin:12px 0;
    border-radius:10px;
    padding:10px;
    border:1px solid #ddd;
}

summary{
    cursor:pointer;
    font-weight:bold;
    color:#0b5ed7;
}

.back{
    text-align:center;
    margin-top:40px;
}

</style>

</head>

<body>

<h1>💼 الاستشارات المهنية</h1>

<div id="questionsContainer">

    <p style="text-align:center;">
    جاري تحميل الإجابات...
    </p>
    
    </div>

<div class="back">
<a href="index.html">🏠 العودة إلى الصفحة الرئيسية</a>
</div><!-- قسم الأسئلة والإجابات -->

<div style="
max-width:900px;
margin:30px auto;
padding:25px;
background:white;
border-radius:20px;
box-shadow:0 6px 18px rgba(0,0,0,0.10);
">

<h2 style="
text-align:center;
color:#0b5ed7;
margin-bottom:10px;
">
💬 أسئلتكن وإجابات التوجيه المهني
</h2>

<p style="
text-align:center;
color:#666;
margin-bottom:25px;
">
تظهر هنا الإجابات المنشورة على أسئلة الطالبات.
</p>

<div id="questionsContainer">

<p style="text-align:center;">
جاري تحميل الإجابات...
</p>

</div>

</div>

<script>

const questionsApi =
"https://script.google.com/macros/s/AKfycbzN466RELsbUTGL6PvNYNRL2HCY6sXqm9eoSY2xpHrsQqoOTc70pGlaTObSLaHCUgOXdA/exec";

fetch(questionsApi)

.then(response => {
    if (!response.ok) {
        throw new Error("تعذر تحميل البيانات");
    }

    return response.json();
})
.then(data => {

const container = document.getElementById("questionsContainer");

container.innerHTML = "";

data.slice(1).forEach(row => {

    const question = row[1] || "";
    const answer = row[2] || "";
    const status = row[3] || "";

    if (
        status.trim() === "منشور" &&
        question.trim() !== "" &&
        answer.trim() !== ""
    ) {

        const item = document.createElement("details");

        item.innerHTML = `
            <summary>❓ ${question}</summary>
            <p>💡 ${answer}</p>
        `;

        container.appendChild(item);
    }

});

    if (container.children.length === 0) {

        container.innerHTML = `
            <p style="
                text-align:center;
                color:#777;
            ">
                لا توجد إجابات منشورة حاليًا.
            </p>
        `;
    }

})

.catch(error => {

    console.error(error);

    document.getElementById("questionsContainer").innerHTML = `
        <p style="
            text-align:center;
            color:#c62828;
        ">
            تعذر تحميل الإجابات حاليًا.
        </p>
    `;

});

</script>

</body>
</html>
